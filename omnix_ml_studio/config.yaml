# Default settings (loaded by ml_studio.core.config.load_yaml; UI choices override them)
app:
  max_upload_mb: 200
  default_seed: 42
validation:
  holdout_fraction: 0.2
  n_folds: 5
  inner_folds: 3
  n_bootstrap: 1000
  n_jobs: 1            # keep 1 on small cloud instances (each worker copies the data)
preprocessing:
  numeric_imputation: median
  scaling: standard
  max_missing_fraction: 0.5
